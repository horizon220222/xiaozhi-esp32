<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小智表情动画预览 V3 · 单色 OLED 设计</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#161a22; --panel2:#1d222e; --line:#2a3142;
    --text:#e8ecf4; --dim:#8b93a7; --accent:#4f8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  header{max-width:1200px;margin:0 auto 8px}
  h1{font-size:22px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.7}
  .sub code{background:var(--panel2);padding:1px 6px;border-radius:4px;color:#9fb6ff;font-size:12px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12px;color:var(--dim)}
  .legend span{background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:20px}
  .controls{max-width:1200px;margin:18px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .controls button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer}
  .controls button:hover{border-color:var(--accent)}
  .controls label{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
  .controls input{accent-color:var(--accent)}
  .grid{max-width:1200px;margin:22px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;cursor:pointer;transition:transform .15s,border-color .15s}
  .tile:hover{transform:translateY(-3px);border-color:var(--accent)}
  .face{position:relative;width:100%;aspect-ratio:2/1;background:#05060a;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .face canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .cap{margin-top:9px;display:flex;align-items:baseline;justify-content:space-between}
  .cap b{font-size:14px;font-weight:600}
  .cap i{font-style:normal;color:var(--dim);font-size:11px}
  .star{color:#ffb454}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(5,6,10,.82);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .modal.open{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(560px,92vw)}
  .modal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .modal .head b{font-size:18px}
  .modal .head button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
  .big{width:100%;aspect-ratio:2/1;background:#05060a;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .big canvas{width:100%;height:100%;image-rendering:pixelated}
  .note{max-width:1200px;margin:22px auto 0;font-size:12px;color:var(--dim);line-height:1.8;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .note b{color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>小智表情动画 · V3 单色 OLED 预览</h1>
  <div class="sub">
    基于原版双眼造型，加入少量情绪符号，并让动作的进入、停留和退出更连贯。
    按 SSD1306 的 128×64 单色像素显示；点击格子可放大查看像素边缘。
  </div>
  <div class="legend">
    <span>原版双眼基准：40×40，圆角 10</span>
    <span>纯黑白 · 原生 128×64 像素 · 30 FPS</span>
    <span class="star">* 舵机动作仍以屏幕动作示意</span>
  </div>
</header>

<div class="controls">
  <button id="toggle" type="button">暂停全部</button>
  <button id="restart" type="button">重新播放</button>
  <label>播放速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><output id="speedValue">1×</output></label>
  <a href="emoji_animations_preview.html" target="_blank" rel="noopener" style="color:#9fb6ff;font-size:13px">打开原版对比 ↗</a>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="box">
    <div class="head"><b id="mTitle"></b><button id="mClose">✕</button></div>
    <div class="big"><canvas id="mCanvas" width="128" height="64"></canvas></div>
  </div>
</div>

<div class="note">
  <b>说明：</b>这是设计预览，并非当前固件截图。保持原版眼睛的尺寸和位置，不加嘴巴；新增的汗滴、心形、惊讶线等均按真实单色像素显示。流畅度来自位置、尺寸和时间曲线的调整，没有灰度渐变。
</div>

<script>
(function(){
  var W=128, H=64;
  var lerp=function(a,b,p){return a+(b-a)*p;};
  var ease=function(p){p=Math.max(0,Math.min(1,p));return p*p*(3-2*p);};
  var mod=function(t,p){return ((t%p)+p)%p;};
  function hold(t,d,enter,exit){t=mod(t,d);return Math.min(ease(t/enter),ease((d-t)/exit));}

  function defEyes(){return {l:{x:39,y:32,w:40,h:40,r:10},r:{x:89,y:32,w:40,h:40,r:10}};}

  function rr(ctx,x,y,w,h,r){
    r=Math.max(0,Math.min(r,w/2,h/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawScene(ctx,t,anim){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    var s=anim(t);
    ctx.fillStyle='#fff';
    if(s.eyes){
      var e=s.eyes;
      rr(ctx,e.l.x-e.l.w/2,e.l.y-e.l.h/2,e.l.w,e.l.h,e.l.r);ctx.fill();
      rr(ctx,e.r.x-e.r.w/2,e.r.y-e.r.h/2,e.r.w,e.r.h,e.r.r);ctx.fill();
    }
    // LVGL 在眼睛前面放置与屏幕同色的矩形，以遮住眼睛的一部分。
    (s.masks||[]).forEach(function(points){
      ctx.fillStyle='#000';ctx.beginPath();
      points.forEach(function(p,i){if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);});
      ctx.closePath();ctx.fill();
    });
    (s.extras||[]).forEach(function(x){
      ctx.save();ctx.globalAlpha=typeof x.alpha==='number'?x.alpha:1;
      ctx.strokeStyle='#fff';ctx.fillStyle='#fff';
      if(x.type==='arc'){
        ctx.lineWidth=x.lw||3;ctx.lineCap='round';
        ctx.beginPath();ctx.arc(x.x,x.y,x.r,x.start,x.end);ctx.stroke();
      }else if(x.type==='line'){
        ctx.lineWidth=x.lw||3;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(x.x1,x.y1);ctx.lineTo(x.x2,x.y2);ctx.stroke();
      }else if(x.type==='circle'){
        ctx.beginPath();ctx.arc(x.x,x.y,x.r,0,2*Math.PI);ctx.fill();
      }else if(x.type==='rect'){
        ctx.fillRect(x.x,x.y,x.w,x.h);
      }else if(x.type==='heart'){
        ctx.save();ctx.translate(x.x,x.y);ctx.scale(x.s,x.s);ctx.beginPath();
        ctx.moveTo(0,11);
        ctx.bezierCurveTo(-21,-4,-15,-18,0,-8);
        ctx.bezierCurveTo(15,-18,21,-4,0,11);
        ctx.closePath();ctx.fill();ctx.restore();
      }else if(x.type==='drop'){
        var r=x.r||4;
        ctx.beginPath();ctx.moveTo(x.x,x.y-r*1.4);
        ctx.bezierCurveTo(x.x+r*.8,x.y-r*.2,x.x+r,x.y+r*.2,x.x+r,x.y+r*.55);
        ctx.arc(x.x,x.y+r*.55,r,0,Math.PI);
        ctx.bezierCurveTo(x.x-r,x.y+r*.2,x.x-r*.8,x.y-r*.2,x.x,x.y-r*1.4);
        ctx.closePath();ctx.fill();
      }else if(x.type==='spark'){
        var sr=x.r||4;ctx.lineWidth=2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(x.x-sr,x.y);ctx.lineTo(x.x+sr,x.y);
        ctx.moveTo(x.x,x.y-sr);ctx.lineTo(x.x,x.y+sr);ctx.stroke();
      }else if(x.type==='cheek'){
        ctx.lineWidth=2;ctx.lineCap='round';
        for(var j=0;j<2;j++){
          ctx.beginPath();ctx.moveTo(x.x+j*4,x.y);ctx.lineTo(x.x+j*4-2,x.y+4);ctx.stroke();
        }
      }else if(x.type==='text'){
        ctx.font='bold '+(x.size||11)+'px monospace';ctx.textAlign='center';ctx.fillText(x.value,x.x,x.y);
      }else if(x.type==='dots'){
        for(var k=0;k<3;k++){
          ctx.beginPath();ctx.arc(x.x+k*5,x.y-(k%2),1.5,0,Math.PI*2);ctx.fill();
        }
      }else if(x.type==='steam'){
        ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
        ctx.moveTo(x.x,x.y+7);ctx.quadraticCurveTo(x.x-3,x.y+3,x.x,x.y);
        ctx.quadraticCurveTo(x.x+3,x.y-3,x.x,x.y-7);ctx.stroke();
      }
      ctx.restore();
    });
    // SSD1306 只有亮/灭两种像素；将 Canvas 的抗锯齿结果压成真正的单色。
    var pixels=ctx.getImageData(0,0,W,H);
    for(var i=0;i<pixels.data.length;i+=4){
      var on=pixels.data[i]>127?255:0;
      pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=on;
      pixels.data[i+3]=255;
    }
    ctx.putImageData(pixels,0,0);
  }

  // ---------- 各表情动画 ----------
  function moodMasks(kind,p){
    if(kind==='happy'){
      // p=0 时遮罩在眼睛下方；p=1 时形成原版的弯眼。
      var y=56-24*p;
      return [
        [[4,y],[70,y+8],[70,70],[4,70]],
        [[58,y+8],[124,y],[124,70],[58,70]]
      ];
    }
    // p=0 时遮罩在眼睛上方，避免循环起点突然变脸。
    var low=-6+49*p,high=-6+37*p;
    return kind==='sad' ? [
      [[4,-8],[70,-8],[70,high],[4,low]],
      [[58,-8],[124,-8],[124,low],[58,high]]
    ] : [
      [[4,-8],[70,-8],[70,low],[4,high]],
      [[58,-8],[124,-8],[124,high],[58,low]]
    ];
  }
  var ANIM={
    blink:function(t){t=mod(t,2200);var e=defEyes(),h=40;
      if(t>=650&&t<790)h=lerp(40,2,ease((t-650)/140));
      else if(t>=790&&t<930)h=lerp(2,40,ease((t-790)/140));
      e.l.h=h;e.r.h=h;return{eyes:e,extras:[]};},
    happy:function(t){var p=hold(t,1700,220,280);
      return{eyes:defEyes(),masks:moodMasks('happy',p)};},
    sad:function(t){var p=hold(t,2300,260,330);
      return{eyes:defEyes(),masks:moodMasks('sad',p)};},
    anger:function(t){var p=hold(t,2300,240,330);
      return{eyes:defEyes(),masks:moodMasks('anger',p)};},
    surprise:function(t){var e=defEyes(),p=hold(t,1600,180,260),s=1+.12*p;
      var w=40*s,h=40*s,r=Math.max(1,10*s);
      e.l.w=w;e.l.h=h;e.l.r=r;e.r.w=w;e.r.h=h;e.r.r=r;return{eyes:e,extras:[]};},
    wakeup:function(t){var e=defEyes(),p=hold(t,1700,360,280);
      e.l.h=e.r.h=2+38*p;return{eyes:e,extras:[]};},
    sleep:function(t){var e=defEyes(),p=hold(t,1700,360,280);
      e.l.h=e.r.h=40-38*p;return{eyes:e,extras:[]};},
    lookleft:function(t){var e=defEyes(),p=hold(t,1700,240,280),dx=-12*p,g=6*p;
      e.l.x+=dx;e.r.x+=dx;e.l.w=40+g;e.l.h=40+g;return{eyes:e,extras:[]};},
    lookright:function(t){var e=defEyes(),p=hold(t,1700,240,280),dx=12*p,g=6*p;
      e.l.x+=dx;e.r.x+=dx;e.r.w=40+g;e.r.h=40+g;return{eyes:e,extras:[]};},
    headnod:function(t){t=mod(t,1600);var e=defEyes(),p=hold(t,1600,160,260);
      var dy=8*p*(1-Math.cos(2*Math.PI*t/480))/2;
      e.l.y+=dy;e.r.y+=dy;return{eyes:e,extras:[]};},
    headshake:function(t){t=mod(t,1500);var e=defEyes(),p=hold(t,1500,160,300);
      var dx=7*p*Math.sin(2*Math.PI*t/280);e.l.x+=dx;e.r.x+=dx;return{eyes:e,extras:[]};},
    headroll:function(t){t=mod(t,1700);var e=defEyes(),p=hold(t,1700,160,330);
      var a=2*Math.PI*t/1200,ox=5*p*Math.sin(a),oy=4*p*(1-Math.cos(a))/2;
      e.l.x+=ox;e.l.y+=oy;e.r.x+=ox;e.r.y+=oy;return{eyes:e,extras:[]};},
    confused:function(t){var e=defEyes(),p=hold(t,1700,220,280);
      e.l.h=e.r.h=40-20*p;return{eyes:e,extras:[]};},
    awkward:function(t){var e=defEyes(),p=hold(t,1900,250,330);
      e.l.h=e.r.h=40-35*p;return{eyes:e,extras:[]};},
    cry:function(t){t=mod(t,2200);var e=defEyes(),p=hold(t,2200,300,330),h=40-8*p,tears=[];
      e.l.h=h;e.r.h=h;
      if(p>.65){var fall=mod(t-300,650)/650;
        tears.push({type:'drop',x:39,y:49+12*ease(fall),r:3});
        tears.push({type:'drop',x:89,y:49+12*ease(mod(t-550,650)/650),r:3});}
      return{eyes:e,extras:tears};},
    laughing:function(t){var e=defEyes(),p=hold(t,1700,200,280),h=40-28*p,r=10,dx=2*p*Math.sin(2*Math.PI*t/180);
      if(h<20)r=20;e.l.h=h;e.r.h=h;e.l.r=r;e.r.r=r;e.l.x+=dx;e.r.x+=dx;return{eyes:e,extras:[]};},
    confident:function(t){var e=defEyes(),p=hold(t,1800,220,300),h=40-20*p,dx=6*p;
      e.l.h=h;e.r.h=h;e.l.x+=dx;e.r.x+=dx;return{eyes:e,extras:[]};},
    silly:function(t){var e=defEyes(),p=hold(t,2000,250,350),s=1-.6*p,dx=8*p*Math.sin(2*Math.PI*t/700);
      e.l.w=40*s;e.l.h=40*s;e.l.x+=dx;e.r.x+=dx;return{eyes:e,extras:[]};},
    delicious:function(t){var e=defEyes(),p=hold(t,1700,230,300),s=1-.3*p,dy=-3*p;
      e.l.w=40*s;e.l.h=40*s;e.l.y+=dy;e.r.w=40*s;e.r.h=40*s;e.r.y+=dy;return{eyes:e,extras:[]};},
    kissy:function(t){var e=defEyes(),p=hold(t,1900,260,330),s=1-.58*p+.05*p*Math.sin(2*Math.PI*t/460);
      var w=40*s,h=40*s,r=w/2;e.l.w=w;e.l.h=h;e.l.r=r;e.r.w=w;e.r.h=h;e.r.r=r;return{eyes:e,extras:[]};},
    cool:function(t){var e=defEyes(),p=hold(t,1800,230,300),h=40-24*p,dx=6*p;
      e.l.h=h;e.r.h=h;e.l.x+=dx;e.r.x+=dx;return{eyes:e,extras:[]};},
    relaxed:function(t){t=mod(t,2200);var e=defEyes(),p=hold(t,2200,350,350),h=40-20*p,w=40-4*p;
      var slowBlink=ease(Math.max(0,1-Math.abs(t-1100)/230));h-=17*slowBlink;
      e.l.h=h;e.r.h=h;e.l.w=w;e.r.w=w;return{eyes:e,extras:[]};},
    thinking:function(t){var e=defEyes(),p=hold(t,2100,280,350),s=1-.7*p,dy=-4*p,dx=6*p*Math.sin(2*Math.PI*t/800);
      e.r.w=40*s;e.r.h=40*s;e.l.x+=dx;e.r.x+=dx;e.l.y+=dy;e.r.y+=dy;return{eyes:e,extras:[]};},
    loving:function(t){var e=defEyes(),p=hold(t,2600,270,350),beat=.5+.5*Math.sin(2*Math.PI*t/780);
      var w=40+5*p*beat,h=40+5*p*beat,r=10+12*p;
      e.l.w=e.r.w=w;e.l.h=e.r.h=h;e.l.r=e.r.r=r;return{eyes:e,extras:[]};},
    shocked:function(t){var e=defEyes(),p=hold(t,1700,150,270),s=1+.25*p;
      var dx=p*Math.sin(2*Math.PI*t/120),dy=p*Math.sin(2*Math.PI*t/170);
      e.l.w=e.r.w=40*s;e.l.h=e.r.h=40*s;e.l.r=e.r.r=20*s;
      e.l.x+=dx;e.r.x+=dx;e.l.y+=dy;e.r.y+=dy;return{eyes:e,extras:[]};},
    embarrassed:function(t){var e=defEyes(),p=hold(t,1800,250,330),s=1-.3*p,dy=5*p,dx=2*p*Math.sin(2*Math.PI*t/520);
      var w=40*s,h=40*s;e.l.w=w;e.l.h=h;e.l.y+=dy;e.l.x+=dx;e.r.w=w;e.r.h=h;e.r.y+=dy;e.r.x+=dx;return{eyes:e,extras:[]};},
    funny:function(t){t=mod(t,1400);var e=defEyes();var ls=1,rs=1;
      if(t<200){ls=lerp(1,1.5,ease(t/200));rs=lerp(1,0.6,ease(t/200));}
      else if(t<1200){ls=1.5;rs=0.6;}else{ls=lerp(1.5,1,ease((t-1200)/200));rs=lerp(0.6,1,ease((t-1200)/200));}
      e.l.w=40*ls;e.l.h=40*ls;e.r.w=40*rs;e.r.h=40*rs;return{eyes:e,extras:[]};}
  };

  // 情绪符号只出现在屏幕边缘，不改变原版的双眼布局。
  var PERIOD={happy:1700,sad:2300,anger:2300,surprise:1600,wakeup:1700,sleep:1700,
    confused:1700,awkward:1900,laughing:1700,loving:2600,embarrassed:1800,
    shocked:1700,thinking:2100,cool:1800,delicious:1700,kissy:1900,
    confident:1800,silly:2000,funny:1400};
  function decorate(key,t,s){
    var d=PERIOD[key];if(!d)return s;
    var q=mod(t,d),p=hold(t,d,240,320);
    if(p<.2)return s;
    var ex=s.extras||(s.extras=[]);
    if(key==='happy'){
      ex.push({type:'spark',x:114,y:12,r:4*p});
    }else if(key==='sad'){
      ex.push({type:'drop',x:114,y:35+9*ease(q/d),r:3*p});
    }else if(key==='anger'){
      ex.push({type:'steam',x:12,y:19},{type:'steam',x:116,y:19});
    }else if(key==='surprise'||key==='shocked'){
      ex.push({type:'spark',x:12,y:11,r:4*p},{type:'spark',x:116,y:11,r:4*p});
    }else if(key==='wakeup'){
      ex.push({type:'spark',x:114,y:15,r:3*p});
    }else if(key==='sleep'){
      ex.push({type:'text',x:115,y:16-3*Math.sin(2*Math.PI*q/d),value:'Z',size:11});
    }else if(key==='confused'){
      ex.push({type:'text',x:115,y:18,value:'?',size:12});
    }else if(key==='awkward'){
      ex.push({type:'drop',x:114,y:16+9*ease(q/d),r:4*p});
    }else if(key==='laughing'){
      ex.push({type:'spark',x:12,y:18,r:3*p});
    }else if(key==='loving'){
      ex.push({type:'heart',x:115,y:17,s:.25*p});
    }else if(key==='embarrassed'){
      ex.push({type:'cheek',x:8,y:47},{type:'cheek',x:111,y:47});
    }else if(key==='thinking'){
      ex.push({type:'dots',x:111,y:52});
    }else if(key==='cool'||key==='delicious'||key==='confident'||key==='funny'){
      ex.push({type:'spark',x:115,y:13,r:3*p});
    }else if(key==='kissy'){
      ex.push({type:'heart',x:115,y:24-6*ease(q/d),s:.22*p});
    }else if(key==='silly'){
      ex.push({type:'dots',x:111,y:12});
    }
    return s;
  }
  Object.keys(ANIM).forEach(function(key){
    var original=ANIM[key];ANIM[key]=function(t){return decorate(key,t,original(t));};
  });

  var LIST=[
    ['blink','眨眼','Blink'],['happy','开心','Happy'],['sad','悲伤','Sad'],['anger','愤怒','Anger'],
    ['surprise','惊讶','Surprise'],['wakeup','唤醒','Wakeup'],['sleep','睡眠','Sleep'],
    ['lookleft','向左看','Look Left'],['lookright','向右看','Look Right'],
    ['headnod','点头*','Head Nod'],['headshake','摇头*','Head Shake'],['headroll','转圈*','Head Roll'],
    ['confused','困惑','Confused'],['awkward','尴尬','Awkward'],['cry','哭泣','Cry'],
    ['laughing','大笑','Laughing'],['funny','滑稽','Funny'],['loving','爱心','Loving'],
    ['embarrassed','害羞','Embarrassed'],['shocked','震惊','Shocked'],['thinking','思考','Thinking'],
    ['cool','酷','Cool'],['relaxed','放松','Relaxed'],['delicious','美味','Delicious'],
    ['kissy','亲亲','Kissy'],['confident','自信','Confident'],['silly','偷笑','Silly']
  ];

  // 与 SelectRandomAnimation() 一致：60/18/18/2/2。
  var rndKey='blink',rndUntil=0,rndStart=0;
  function randomAnim(t){
    if(t>=rndUntil){
      var n=Math.random()*100;
      rndKey=n<60?'blink':n<78?'lookleft':n<96?'lookright':n<98?'headroll':'confused';
      rndStart=t;rndUntil=t+2500;
    }
    return ANIM[rndKey](t-rndStart);
  }

  var grid=document.getElementById('grid');
  var tiles={};
  LIST.forEach(function(item){
    var key=item[0];
    var div=document.createElement('div');div.className='tile';
    div.innerHTML='<div class="face"><canvas width="'+W+'" height="'+H+'"></canvas></div>'+
      '<div class="cap"><b>'+item[1]+'</b><i>'+item[2]+'</i></div>';
    grid.appendChild(div);
    var c=div.querySelector('canvas'),ctx=c.getContext('2d');
    ctx.imageSmoothingEnabled=false;
    tiles[key]={div:div,ctx:ctx,fn:ANIM[key]};
    div.addEventListener('click',function(){openModal(key,item[1]+' · '+item[2]);});
  });
  // 随机格
  var rd=document.createElement('div');rd.className='tile';
  rd.innerHTML='<div class="face"><canvas width="'+W+'" height="'+H+'"></canvas></div>'+
    '<div class="cap"><b>随机</b><i>Random</i></div>';
  grid.appendChild(rd);
  var rc=rd.querySelector('canvas'),rctx=rc.getContext('2d');rctx.imageSmoothingEnabled=false;
  rd.addEventListener('click',function(){openModal('random','随机 · Random');});

  function openModal(key,title){
    document.getElementById('mTitle').textContent=title;
    document.getElementById('modal').classList.add('open');
    mkey=key;
  }
  var mkey=null;
  var mCanvas=document.getElementById('mCanvas'),mctx=mCanvas.getContext('2d');
  mctx.imageSmoothingEnabled=false;
  document.getElementById('mClose').addEventListener('click',function(){document.getElementById('modal').classList.remove('open');mkey=null;});
  document.getElementById('modal').addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');mkey=null;}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('modal').classList.remove('open');mkey=null;}});

  var elapsed=0,last=performance.now(),rendered=-1000,paused=false,rate=1;
  document.getElementById('toggle').addEventListener('click',function(){
    paused=!paused;this.textContent=paused?'继续播放':'暂停全部';
  });
  document.getElementById('restart').addEventListener('click',function(){
    elapsed=0;rndUntil=0;
  });
  document.getElementById('speed').addEventListener('input',function(){
    rate=Number(this.value);document.getElementById('speedValue').textContent=rate+'×';
  });
  function frame(timestamp){
    if(!paused)elapsed+=Math.min(timestamp-last,100)*rate;
    last=timestamp;
    if(timestamp-rendered>=33){
      var now=elapsed;
      for(var k in tiles){drawScene(tiles[k].ctx,now,ANIM[k]);}
      drawScene(rctx,now,randomAnim);
      if(mkey){drawScene(mctx,now,mkey==='random'?randomAnim:ANIM[mkey]);}
      rendered=timestamp;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
